# Configuration for GitHub's automatically generated release notes.
# Merged pull requests are grouped by label. A pull request that matches no
# category lands under "Other changes"; label it `ignore-for-release` to leave
# it out. Docs:
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
