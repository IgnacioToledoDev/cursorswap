name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job is granted write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ASSET: cursorswap-x86_64-unknown-linux-gnu

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag against SemVer
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release.sh check-tag "$TAG" > tag-info.txt
          cat tag-info.txt
          cat tag-info.txt >> "$GITHUB_OUTPUT"
          rm tag-info.txt
      - name: Require stable releases to come from main
        if: steps.tag.outputs.prerelease == 'false'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::stable tag ${TAG} points to a commit that is not on main; merge it by pull request first" >&2
            exit 1
          fi

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply the tag version to Cargo.toml and Cargo.lock
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Runner-only: the bump is never committed or pushed (main is protected).
          if [ "$(sh scripts/release.sh cargo-version)" != "$VERSION" ]; then
            sh scripts/release.sh bump "$VERSION"
          fi
          cargo update --workspace
          grep -q "^version = \"${VERSION}\"$" Cargo.toml
      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    name: Build
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Apply the tag version to Cargo.toml and Cargo.lock
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Runner-only: the bump is never committed or pushed (main is protected).
          if [ "$(sh scripts/release.sh cargo-version)" != "$VERSION" ]; then
            sh scripts/release.sh bump "$VERSION"
          fi
          cargo update --workspace
          grep -q "^version = \"${VERSION}\"$" Cargo.toml
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Check the binary reports the tag version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          reported=$(target/x86_64-unknown-linux-gnu/release/cursorswap --version)
          echo "$reported"
          case $reported in
            *" ${VERSION}") ;;
            *)
              echo "::error::binary reports '${reported}', expected version ${VERSION}" >&2
              exit 1
              ;;
          esac
      - name: Stage assets and checksum
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/cursorswap "dist/${ASSET}"
          (cd dist && sha256sum "${ASSET}" > "${ASSET}.sha256")
          (cd dist && sha256sum -c "${ASSET}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            channel="--prerelease"
          else
            channel="--latest"
          fi
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag "$channel"
