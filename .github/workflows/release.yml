name: Release

on:
  push:
    tags: ["v*"]

# Only this workflow may write to the repository: it publishes the release.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ASSET: cursorswap-x86_64-unknown-linux-gnu

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Verify the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}" >&2
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Stage assets and checksum
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/cursorswap "dist/${ASSET}"
          (cd dist && sha256sum "${ASSET}" > "${ASSET}.sha256")
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags="--generate-notes"
          case "${GITHUB_REF_NAME}" in *-*) flags="${flags} --prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" ${flags}
