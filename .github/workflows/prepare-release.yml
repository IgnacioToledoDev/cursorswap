name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 0.2.0 or 0.3.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Open the version bump pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sh scripts/release.sh check-tag "v${VERSION}" >/dev/null
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/release/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::branch release/v${VERSION} already exists" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git switch -c "release/v${VERSION}"
          sh scripts/release.sh bump "$VERSION"
          cargo update --workspace
          changed=$(git status --porcelain | sed 's/^...//' | sort | tr '\n' ' ')
          if [ "$changed" != "Cargo.lock Cargo.toml " ]; then
            echo "::error::unexpected changes: ${changed}" >&2
            exit 1
          fi
      - name: Commit and push the branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${VERSION}"
          git push origin "release/v${VERSION}"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          body=$(printf '%s\n' \
            "Bumps the version to ${VERSION}." \
            "" \
            "Merge this pull request, then publish the release from main:" \
            "" \
            '```sh' \
            "git switch main && git pull --ff-only" \
            "git tag -a v${VERSION} -m v${VERSION} && git push origin v${VERSION}" \
            '```')
          if ! gh pr create --base main --head "release/v${VERSION}" \
            --title "chore: release ${VERSION}" --body "$body"; then
            echo "::warning::could not open the pull request (is \"Allow GitHub Actions to create and approve pull requests\" enabled?). The branch was pushed: open it manually at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...release/v${VERSION}?expand=1"
          fi
