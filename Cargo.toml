[package]
name = "cursorswap"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false }
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
ureq = "3.4.2"
xcursor = "0.3.11"

[dev-dependencies]
tempfile = "3.27.0"
