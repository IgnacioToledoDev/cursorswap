[package]
name = "cursorswap"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false }
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
xcursor = "0.3.11"

[dev-dependencies]
tempfile = "3.27.0"
